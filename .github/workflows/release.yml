name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and release signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Write release-defines.json
        env:
          GIPHY_API_KEY: ${{ secrets.GIPHY_API }}
          KLIPY_API_KEY: ${{ secrets.KLIPY_API }}
        run: |
          printf '{\n  "GIPHY_API_KEY": "%s",\n  "KLIPY_API_KEY": "%s",\n  "APIFY_API_TOKEN": ""\n}\n' \
            "$GIPHY_API_KEY" "$KLIPY_API_KEY" > android/release-defines.json

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Write key.properties
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" \
            > android/key.properties

      - name: Write google-services.json placeholder
        run: |
          if [ ! -f android/app/google-services.json ]; then
            cat > android/app/google-services.json <<'GSJ_EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "stickr-placeholder",
              "storage_bucket": "stickr-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.stickr.stickr" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "placeholder" }],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              }
            ],
            "configuration_version": "1"
          }
          GSJ_EOF
          fi

      - name: Build release APKs (per-ABI)
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define-from-file=android/release-defines.json

      - name: Determine release tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename APKs
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          DIR=build/app/outputs/flutter-apk
          cp "$DIR/app-armeabi-v7a-release.apk" "$DIR/stickr-${TAG}-armeabi-v7a.apk"
          cp "$DIR/app-arm64-v8a-release.apk"   "$DIR/stickr-${TAG}-arm64-v8a.apk"
          cp "$DIR/app-x86_64-release.apk"      "$DIR/stickr-${TAG}-x86_64.apk"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Stickr ${{ steps.tag.outputs.tag }}
          body: |
            ## Install via Obtainium

            Add this repository in [Obtainium](https://github.com/ImranR98/Obtainium):
            ```
            https://github.com/Clafter/Sticker
            ```
            Set the **APK file name filter** to `stickr-.*\.apk`.

            Obtainium automatically selects the APK that matches your device's CPU architecture:

            | APK | Architecture | Devices |
            |-----|-------------|---------|
            | `stickr-*-arm64-v8a.apk` | 64-bit ARM | Most phones since 2016 |
            | `stickr-*-armeabi-v7a.apk` | 32-bit ARM | Older Android phones |
            | `stickr-*-x86_64.apk` | 64-bit x86 | Emulators / x86 tablets |

            Each APK is ~80–100 MB (down from ~290 MB for the universal build).

            ## What's new

            See [commits](https://github.com/Clafter/Sticker/commits/${{ steps.tag.outputs.tag }}) for changes since the last release.
          files: |
            build/app/outputs/flutter-apk/stickr-${{ steps.tag.outputs.tag }}-armeabi-v7a.apk
            build/app/outputs/flutter-apk/stickr-${{ steps.tag.outputs.tag }}-arm64-v8a.apk
            build/app/outputs/flutter-apk/stickr-${{ steps.tag.outputs.tag }}-x86_64.apk
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
